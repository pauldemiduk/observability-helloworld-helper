version: '3.8'

services:
  golang-service:
    build:
      context: ./hello-world-go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVICE_PORT: "8080"
      CLOUD_PROVIDER: "docker"
      CLOUD_REGION: "local"
      CLOUD_ZONE: "local"
      RUNTIME_LANGUAGE: "Golang"

  python-service:
    build:
      context: ./hello-world-python
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SERVICE_PORT: "8081"
      CLOUD_PROVIDER: "docker"
      CLOUD_REGION: "local"
      CLOUD_ZONE: "local"
      RUNTIME_LANGUAGE: "Python"

  csharp-service:
    build:
      context: ./hello-world-csharp
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SERVICE_PORT: "8082"
      CLOUD_PROVIDER: "docker"
      CLOUD_REGION: "local"
      CLOUD_ZONE: "local"
      RUNTIME_LANGUAGE: "C#"
